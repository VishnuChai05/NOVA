services:
  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: nova-backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/ohsou.db}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SCRAPE_JOB_QUEUE_NAME=${SCRAPE_JOB_QUEUE_NAME:-scrape}
      - SCRAPE_JOB_TIMEOUT_SECONDS=${SCRAPE_JOB_TIMEOUT_SECONDS:-7200}
    volumes:
      - nova_data:/data
      - nova_logs:/app/.logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; import sys; urlopen('http://127.0.0.1:8000/api/health', timeout=3).read(); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    container_name: nova-worker
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/ohsou.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SCRAPE_JOB_QUEUE_NAME=${SCRAPE_JOB_QUEUE_NAME:-scrape}
      - SCRAPE_JOB_TIMEOUT_SECONDS=${SCRAPE_JOB_TIMEOUT_SECONDS:-7200}
    command: ["python", "-m", "app.workers.rq_worker"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - nova_data:/data
      - nova_logs:/app/.logs
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; import os, sys; sys.exit(0 if Redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379/0')).ping() else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: nova-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  nova_data:
  nova_logs:
